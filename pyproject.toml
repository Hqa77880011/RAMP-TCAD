[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RAMP-TCAD"
version = "0.1.0"
description = "RAMP-TCAD implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.scripts]
ramp-tcad = "ramp_tcad.cli:main"

[tool.setuptools.packages.find]
include = ["ramp_tcad*"]

[project.optional-dependencies]
advanced = ["botorch>=0.18,<0.19", "pymoo>=0.6.2,<0.7"]
